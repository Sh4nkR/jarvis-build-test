plugins { id 'com.android.application' }

android {
    namespace 'com.jarvis.hands'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jarvis.hands'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug { }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
